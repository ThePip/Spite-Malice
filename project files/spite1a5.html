        }
    }
    deck.sort(() => Math.random() - 0.5);
}

    center = [[],[],[],[]];

    aiDiscard = [[],[],[],[]];

    drawHand(aiHand);
    startPlayerTurn();
}

// ====== Hand & Turn ======
function drawHand(hand) {

        if(deck.length===0 && recyclePile.length>0){
            deck = recyclePile.sort(()=>Math.random()-0.5);
            recyclePile = [];
        }
        if(deck.length===0) break;
        hand.push(deck.shift());
    }
}

function startPlayerTurn(){
    playerTurn = true;
    drawHand(playerHand);
    render();
}
